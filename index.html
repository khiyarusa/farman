<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0c0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>فرمان — FARMAN</title>
    <link rel="icon" href="./assets/brand/icon-192.png" />
    <link rel="preload" href="./assets/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="FARMAN game viewport"></canvas>
      <div id="ui-root" class="ui-root"></div>
    </div>

    <div id="boot" class="boot-screen">
      <div class="boot-mark" aria-hidden="true">
        <svg viewBox="0 0 120 120" width="96" height="96" role="img" aria-label="فرمان">
          <circle cx="60" cy="60" r="52" fill="none" stroke="#2ea37f" stroke-width="2" opacity="0.55" />
          <circle cx="60" cy="60" r="40" fill="none" stroke="#eef1f2" stroke-width="7" opacity="0.9" />
          <path d="M60 20 V52" stroke="#eef1f2" stroke-width="7" stroke-linecap="round" />
          <path d="M20 60 H100" stroke="#eef1f2" stroke-width="7" stroke-linecap="round" opacity="0.55" />
          <circle cx="60" cy="60" r="11" fill="#2ea37f" />
        </svg>
      </div>
      <div class="boot-title">فرمان</div>
      <div class="boot-tagline">هر خودرو، رفتار خودش را دارد</div>
      <div class="boot-bar"><span id="boot-progress"></span></div>
      <div id="boot-status" class="boot-status">در حال آماده‌سازی…</div>
    </div>

    <noscript>برای اجرای بازی باید JavaScript فعال باشد.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
