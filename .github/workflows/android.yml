name: Android

on:
  push:
    branches: ['main', 'agent/**']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK and release AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Gradle build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/farman-v0.1.0-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/farman-v0.1.0-release-unsigned.aab || true
          cd artifacts && sha256sum * > SHA256SUMS.txt || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: farman-android
          path: artifacts
          retention-days: 30
