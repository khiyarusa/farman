name: CI

on:
  push:
    branches: ['main', 'agent/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint, tests, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Production web build
        run: npx vite build

      - name: Verify the entry HTML has no remote runtime assets
        run: |
          if grep -E 'src="https?://|href="https?://' dist/index.html; then
            echo "::error::index.html references a remote asset"
            exit 1
          fi
          echo "index.html references only local assets."

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: farman-web
          path: dist
          retention-days: 14
